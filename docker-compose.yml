# ---------------------------------------------------------------------------
# Full local stack: PostgreSQL + dashboard + API.
#
#   docker compose up --build
#   docker compose exec dashboard python scripts/ingest.py
#   docker compose exec dashboard python scripts/train_models.py
#
# Dashboard: http://localhost:8501   API: http://localhost:8000/docs
#
# CHANGE THE PASSWORDS BELOW BEFORE DEPLOYING ANYWHERE PUBLIC.
# ---------------------------------------------------------------------------

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ipl
      POSTGRES_USER: ipl_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-too}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ipl_user -d ipl"]
      interval: 10s
      timeout: 5s
      retries: 5

  dashboard:
    build: .
    command: dashboard
    environment:
      IPL_DATABASE_URL: postgresql+psycopg2://ipl_user:${POSTGRES_PASSWORD:-change-me-too}@db:5432/ipl
      IPL_ADMIN_PASSWORD: ${IPL_ADMIN_PASSWORD:-change-me}
      IPL_LOG_LEVEL: INFO
    ports:
      - "8501:8501"
    volumes:
      # Share the feed cache and trained models between services and restarts.
      - feedcache:/app/data/raw
      - models:/app/models/artifacts
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  api:
    build: .
    command: api
    environment:
      IPL_DATABASE_URL: postgresql+psycopg2://ipl_user:${POSTGRES_PASSWORD:-change-me-too}@db:5432/ipl
      IPL_LOG_LEVEL: INFO
      API_WORKERS: "2"
    ports:
      - "8000:8000"
    volumes:
      - models:/app/models/artifacts:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

volumes:
  pgdata:
  feedcache:
  models:
