# Streamlit configuration.
# Colours here match the dashboard's validated chart palette so the app chrome
# and the charts read as one system.

[theme]
primaryColor = "#2a78d6"
backgroundColor = "#fcfcfb"
secondaryBackgroundColor = "#f3f3f0"
textColor = "#0b0b0b"
font = "sans serif"

[server]
# The dashboard never accepts file uploads; keep the limit small.
maxUploadSize = 5
enableXsrfProtection = true
headless = true

[browser]
gatherUsageStats = false

[client]
# Show a clean error page rather than a stack trace to end users.
showErrorDetails = false
toolbarMode = "minimal"
