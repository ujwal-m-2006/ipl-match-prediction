name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11-3.13 are the versions with reliable LightGBM/CatBoost wheels.
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        # The live-feed test is deselected: CI must not depend on a third-party
        # host being reachable, and must not add load to it on every push.
        run: pytest -m "not network" --cov=src/ipl --cov-report=term-missing

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: .coverage
          if-no-files-found: ignore

  smoke:
    name: End-to-end smoke test
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - name: Create the schema
        run: python scripts/init_db.py

      - name: Ingest a small slice of real data
        # Exercises the real feed client end to end, but bounded to a handful of
        # matches so the job stays fast and the origin stays unbothered.
        run: python scripts/ingest.py --seasons 2026 --limit 6 --no-cricsheet
        env:
          IPL_REQUEST_DELAY: "1.0"

      - name: Verify the data landed
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "src")
          from ipl.db import repository as repo
          summary = repo.database_summary()
          print(summary)
          assert summary["matches"] > 0, "no matches were ingested"
          assert summary["innings"] > 0, "no innings were ingested"
          PY

      - name: Check the API imports and serves its schema
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "src")
          from fastapi.testclient import TestClient
          from ipl.api.main import app

          with TestClient(app) as client:
              health = client.get("/health")
              assert health.status_code == 200, health.text
              print(health.json())
              assert client.get("/openapi.json").status_code == 200
              assert client.get("/teams").status_code == 200
          PY

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install ruff

      - name: Ruff
        # Advisory for now: style findings should not block a merge.
        run: ruff check src tests scripts --output-format=github || true

      - name: Check the package imports cleanly
        run: |
          pip install -r requirements.txt
          python -c "import sys; sys.path.insert(0, 'src'); import ipl; print(ipl.__version__)"
